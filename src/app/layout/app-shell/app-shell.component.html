<div class="flex h-dvh flex-col overflow-hidden">
  <rally-topbar [hideOffset]="topbarHideOffset()" [menuOpen]="drawerOpen()" (menuToggled)="toggleDrawer()" />
  <main
    class="no-scrollbar flex-1 overflow-y-auto pt-[calc(4rem+env(safe-area-inset-top))]"
    (scroll)="onMainScroll($event)"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div
      class="mx-auto max-w-7xl px-5 pt-6"
      [class.pb-6]="auth.isObserver()"
      [class.pb-28]="!auth.isObserver()"
    >
      <router-outlet />
    </div>
  </main>
  <rally-nav-drawer [open]="drawerOpen()" (closed)="closeDrawer()" />
  @if (!auth.isObserver()) {
    <rally-messages-widget />
  }
</div>
