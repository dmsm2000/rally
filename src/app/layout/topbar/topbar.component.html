<header class="sticky top-0 z-40 border-b border-border bg-background/85 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-6 px-5">
    <a routerLink="/" class="shrink-0 inline-flex items-center gap-2 text-ink" aria-label="Rally home">
      <svg viewBox="0 0 40 40" class="size-7" fill="none" aria-hidden="true">
        <circle cx="18" cy="20" r="13" stroke="currentColor" stroke-width="3" />
        <path d="M6.5 13.8C13 17 17.5 22.5 19 31.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <path d="M29.5 12C25 15.5 22.5 20 22.2 26" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <circle cx="33" cy="8" r="4" fill="var(--lime)" />
      </svg>
      <span class="text-display text-xl leading-none">Rally</span>
    </a>

    <nav class="no-scrollbar hidden min-w-0 items-center gap-1 overflow-x-auto lg:flex">
      @for (item of primary; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-foreground text-background"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="shrink-0 rounded-full px-3.5 py-2 text-sm font-semibold whitespace-nowrap text-muted-foreground transition-colors hover:text-foreground"
        >
          {{ item.label | translate }}
        </a>
      }
      @for (item of secondary; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-foreground text-background"
          class="shrink-0 rounded-full px-3.5 py-2 text-sm font-semibold whitespace-nowrap text-muted-foreground transition-colors hover:text-foreground"
        >
          {{ item.label | translate }}
        </a>
      }
    </nav>

    <div class="ml-auto flex shrink-0 items-center gap-2">
      <app-language-switcher />
      <app-theme-toggle />
      <button [attr.aria-label]="'nav.search' | translate" type="button" class="flex size-10 items-center justify-center rounded-full border border-border bg-card hover:border-foreground">⌕</button>
      <button [attr.aria-label]="'nav.notifications' | translate" type="button" class="relative flex size-10 items-center justify-center rounded-full border border-border bg-card hover:border-foreground">
        ♥
        <span class="absolute top-2 right-2.5 size-2 rounded-full bg-lime-deep"></span>
      </button>
      <a routerLink="/profile" [attr.aria-label]="'nav.yourProfile' | translate">
        <ui-avatar [initials]="auth.currentPlayer().initials" accent="lime" size="sm" />
      </a>
    </div>
  </div>
</header>
