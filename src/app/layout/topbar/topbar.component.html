<header class="z-40 h-16 shrink-0 border-b border-border bg-background/85 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-3 sm:gap-6 sm:px-5">
      <div class="flex shrink-0 items-center">
        <a routerLink="/" class="shrink-0 inline-flex items-center gap-2 text-foreground" aria-label="Rally home">
          <img
            [src]="theme.theme() === 'dark' ? 'assets/rally-logo-white.svg' : 'assets/rally-logo.svg'"
            alt=""
            class="size-7"
          />
          <span class="text-display text-xl leading-none">Rally</span>
        </a>
      </div>

      <nav
        class="no-scrollbar relative hidden min-w-0 flex-1 items-center justify-center gap-1 overflow-x-auto lg:flex"
      >
        <span
          class="nav-indicator"
          [style.width.px]="indicatorWidth()"
          [style.transform]="'translateX(' + indicatorLeft() + 'px)'"
          [class.opacity-0]="indicatorWidth() === 0"
        ></span>
        @for (item of primary(); track item.path) {
          <a
            #navLink
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            (isActiveChange)="onActiveChange($event, navLink)"
            class="nav-link shrink-0 rounded-full px-3.5 py-2 text-sm font-semibold whitespace-nowrap text-muted-foreground transition-colors hover:text-foreground"
          >
            <span class="relative z-10">{{ item.label | translate }}</span>
          </a>
        }
        @for (item of secondary(); track item.path) {
          <a
            #navLink
            [routerLink]="item.path"
            routerLinkActive="is-active"
            (isActiveChange)="onActiveChange($event, navLink)"
            class="nav-link shrink-0 rounded-full px-3.5 py-2 text-sm font-semibold whitespace-nowrap text-muted-foreground transition-colors hover:text-foreground"
          >
            <span class="relative z-10">{{ item.label | translate }}</span>
          </a>
        }
      </nav>

      <div class="flex shrink-0 items-center justify-end gap-1.5 sm:gap-2">
        <rally-language-switcher />
        <rally-theme-toggle />
        @if (!auth.isObserver()) {
          <rally-notifications-bell />
        }
        @if (auth.isObserver()) {
          <button
            type="button"
            (click)="exitObserverMode()"
            [attr.aria-label]="'nav.exitObserver' | translate"
            class="flex size-9 cursor-pointer items-center justify-center rounded-full border border-border bg-card text-base"
          >
            👀
          </button>
        } @else {
          <a routerLink="/profile" [attr.aria-label]="'nav.yourProfile' | translate">
            <ui-avatar
              [initials]="auth.currentPlayer().initials"
              [seed]="auth.currentPlayer().avatarSeed"
              [avatarStyle]="auth.currentPlayer().avatarStyle"
              accent="lime"
              size="sm"
            />
          </a>
        }
      </div>
    </div>
  </header>
