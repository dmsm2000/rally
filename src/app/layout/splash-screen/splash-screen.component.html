@if (visible()) {
  <div class="splash pointer-events-none fixed inset-0 z-[100] flex flex-col items-center justify-center gap-4" [class.splash--fading]="fading()">
    <div class="splash-photos absolute inset-0 overflow-hidden bg-ink">
      <!-- One random court per load, so repeat visits (login/register, refreshes) don't always show the same one. -->
      <img [src]="photoSrc" alt="" class="splash-photo absolute inset-0 size-full object-cover" />
      <div class="absolute inset-0 bg-ink/80"></div>
    </div>

    <div class="splash-stage relative z-10 size-56">
      <svg viewBox="0 0 224 224" class="absolute inset-0 size-full">
        <path d="M112 39.2A72.8 72.8 0 1 1 111.9 39.2Z" pathLength="100" class="splash-logo-world" />
        <path
          d="M47.6 77.28C84 95.2 109.2 126 117.6 176.4"
          pathLength="100"
          class="splash-logo-mountain splash-logo-mountain--a"
        />
        <path
          d="M135.52 145.6C137.2 112 151.2 86.8 176.4 67.2"
          pathLength="100"
          class="splash-logo-mountain splash-logo-mountain--b"
        />
        <circle cx="196" cy="44.8" r="22.4" class="splash-logo-sun" />
      </svg>
      <!-- Each ball travels the exact same path as the shape it's drawing, one after another: world, then each mountain. -->
      <span class="splash-ball splash-ball--world absolute" aria-hidden="true">🎾</span>
      <span class="splash-ball splash-ball--mountain-a absolute" aria-hidden="true">🎾</span>
      <span class="splash-ball splash-ball--mountain-b absolute" aria-hidden="true">🎾</span>
    </div>
    <p class="splash-wordmark relative z-10 text-display text-3xl text-bone">Rally</p>
  </div>
}
