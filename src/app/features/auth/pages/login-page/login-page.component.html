<div class="no-scrollbar h-dvh overflow-y-auto bg-background px-5 py-10 sm:py-16">
  <div class="mx-auto max-w-xl">
    <div class="mb-10 flex items-center justify-between gap-3">
      <a routerLink="/" class="inline-flex items-center gap-2 text-foreground" aria-label="Rally home">
        <img
          [src]="theme.theme() === 'dark' ? 'assets/rally-logo-white.svg' : 'assets/rally-logo.svg'"
          alt=""
          class="size-7"
        />
        <span class="text-display text-xl leading-none">Rally</span>
      </a>
      <div class="flex items-center gap-2">
        <rally-language-switcher />
        <rally-theme-toggle />
      </div>
    </div>

    <p class="text-eyebrow text-muted-foreground">{{ 'auth.loginEyebrow' | translate }}</p>
    <h1 class="text-display mt-2 text-4xl sm:text-5xl">{{ 'auth.loginTitle' | translate }}</h1>
    <p class="mt-3 max-w-md text-sm text-muted-foreground">{{ 'auth.loginLead' | translate }}</p>

    <form class="mt-8 rounded-3xl border border-border bg-card p-6 sm:p-8" (ngSubmit)="onSubmit()">
      <div class="space-y-5">
        <label class="block">
          <span class="mb-1.5 block text-xs font-semibold text-muted-foreground">* {{ 'auth.email' | translate }}</span>
          <input
            [ngModel]="email()"
            (ngModelChange)="setEmail($event)"
            name="email"
            type="email"
            autocomplete="email"
            [placeholder]="'auth.emailPlaceholder' | translate"
            [class]="
              'w-full rounded-xl border bg-background px-4 py-3 text-sm outline-none placeholder:text-muted-foreground focus:border-foreground ' +
              (fieldError() ? 'border-loss' : 'border-border')
            "
          />
        </label>
        <label class="block">
          <span class="mb-1.5 block text-xs font-semibold text-muted-foreground"
            >* {{ 'auth.password' | translate }}</span
          >
          <div class="relative">
            <input
              [ngModel]="password()"
              (ngModelChange)="setPassword($event)"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              [placeholder]="'auth.passwordPlaceholder' | translate"
              [class]="
                'w-full rounded-xl border bg-background px-4 py-3 pr-11 text-sm outline-none placeholder:text-muted-foreground focus:border-foreground ' +
                (fieldError() ? 'border-loss' : 'border-border')
              "
            />
            <ui-password-toggle [visible]="showPassword()" (toggled)="showPassword.set(!showPassword())" />
          </div>
        </label>
      </div>

      <button
        type="submit"
        [disabled]="!canSubmit()"
        class="mt-6 w-full cursor-pointer rounded-full bg-lime px-6 py-3 text-sm font-extrabold tracking-wide text-ink uppercase transition-transform hover:-translate-y-0.5 disabled:pointer-events-none disabled:opacity-40"
      >
        {{ (submitting() ? 'auth.signingIn' : 'auth.signIn') | translate }}
      </button>

      <p class="mt-3 text-center text-sm">
        <a
          routerLink="/forgot-password"
          class="font-semibold text-muted-foreground hover:text-foreground hover:underline"
          >{{ 'auth.forgotPassword' | translate }}</a
        >
      </p>
    </form>

    <div class="mt-6 flex items-center gap-3 text-xs text-muted-foreground">
      <span class="h-px flex-1 bg-border"></span>
      {{ 'auth.or' | translate }}
      <span class="h-px flex-1 bg-border"></span>
    </div>

    <button
      type="button"
      (click)="enterAsObserver()"
      class="mt-6 w-full cursor-pointer rounded-full border border-border px-6 py-3 text-sm font-extrabold tracking-wide uppercase hover:border-foreground"
    >
      👀 {{ 'auth.enterAsObserver' | translate }}
    </button>

    <p class="mt-6 text-center text-sm text-muted-foreground">
      {{ 'auth.noAccount' | translate }}
      <a routerLink="/register" class="font-semibold text-foreground hover:underline">{{
        'auth.createAccount' | translate
      }}</a>
    </p>
  </div>
</div>
