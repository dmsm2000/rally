<div class="no-scrollbar h-dvh overflow-y-auto bg-background px-5 py-10 sm:py-16">
  <div class="mx-auto max-w-xl">
    <div class="mb-10 flex items-center justify-between gap-3">
      <a routerLink="/" class="inline-flex items-center gap-2 text-foreground" aria-label="Rally home">
        <img [src]="theme.theme() === 'dark' ? 'assets/rally-logo-white.svg' : 'assets/rally-logo.svg'" alt="" class="size-7" />
        <span class="text-display text-xl leading-none">Rally</span>
      </a>
      <div class="flex items-center gap-2">
        <rally-language-switcher />
        <rally-theme-toggle />
      </div>
    </div>

    @if (done()) {
      <p class="text-eyebrow text-muted-foreground">{{ 'auth.checkEmailEyebrow' | translate }}</p>
      <h1 class="text-display mt-2 text-4xl sm:text-5xl">{{ 'auth.resetDoneTitle' | translate }}</h1>
      <p class="mt-3 max-w-md text-sm text-muted-foreground">{{ 'auth.resetDoneLead' | translate }}</p>

      <button
        type="button"
        (click)="goToLogin()"
        class="mt-8 w-full cursor-pointer rounded-full bg-lime px-6 py-3 text-sm font-extrabold tracking-wide text-ink uppercase transition-transform hover:-translate-y-0.5"
      >
        {{ 'auth.signIn' | translate }}
      </button>
    } @else {
      <p class="text-eyebrow text-muted-foreground">{{ 'auth.resetPasswordEyebrow' | translate }}</p>
      <h1 class="text-display mt-2 text-4xl sm:text-5xl">{{ 'auth.resetPasswordTitle' | translate }}</h1>
      <p class="mt-3 max-w-md text-sm text-muted-foreground">{{ 'auth.resetPasswordLead' | translate }}</p>

      <form class="mt-8 rounded-3xl border border-border bg-card p-6 sm:p-8" (ngSubmit)="onSubmit()">
        <div class="space-y-5">
          <label class="block">
            <span class="mb-1.5 block text-xs font-semibold text-muted-foreground">* {{ 'auth.newPassword' | translate }}</span>
            <input
              [ngModel]="password()"
              (ngModelChange)="setPassword($event)"
              name="password"
              type="password"
              autocomplete="new-password"
              [class]="
                'w-full rounded-xl border bg-background px-4 py-3 text-sm outline-none placeholder:text-muted-foreground focus:border-foreground ' +
                (fieldError() ? 'border-loss' : 'border-border')
              "
            />
          </label>
          <label class="block">
            <span class="mb-1.5 block text-xs font-semibold text-muted-foreground">* {{ 'auth.confirmPassword' | translate }}</span>
            <input
              [ngModel]="confirmPassword()"
              (ngModelChange)="setConfirmPassword($event)"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              [class]="
                'w-full rounded-xl border bg-background px-4 py-3 text-sm outline-none placeholder:text-muted-foreground focus:border-foreground ' +
                (fieldError() ? 'border-loss' : 'border-border')
              "
            />
            @if (passwordsMismatch()) {
              <span class="mt-1.5 block text-xs font-semibold text-loss">{{ 'auth.passwordMismatch' | translate }}</span>
            }
          </label>
        </div>

        <button
          type="submit"
          [disabled]="!canSubmit()"
          class="mt-6 w-full cursor-pointer rounded-full bg-lime px-6 py-3 text-sm font-extrabold tracking-wide text-ink uppercase transition-transform hover:-translate-y-0.5 disabled:pointer-events-none disabled:opacity-40"
        >
          {{ (submitting() ? 'auth.savingPassword' : 'auth.savePassword') | translate }}
        </button>
      </form>
    }
  </div>
</div>
