<div class="fixed inset-0 z-[110] flex items-center justify-center bg-ink/60 px-4" role="presentation">
  <div
    class="animate-tennis-pop w-full max-w-sm rounded-3xl border border-border bg-card p-6 shadow-xl sm:p-8"
    role="dialog"
    aria-modal="true"
  >
    <p class="text-eyebrow text-muted-foreground">{{ 'profile.changePassword' | translate }}</p>
    <p class="mt-1 text-sm text-muted-foreground">{{ 'profile.changePasswordLead' | translate }}</p>

    <form class="mt-5 space-y-4" (ngSubmit)="submit()">
      <label class="block">
        <span class="mb-1.5 block text-xs font-semibold text-muted-foreground"
          >* {{ 'auth.currentPassword' | translate }}</span
        >
        <div class="relative">
          <input
            [ngModel]="currentPassword()"
            (ngModelChange)="setCurrentPassword($event)"
            name="currentPassword"
            [type]="showCurrentPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            [placeholder]="'auth.currentPasswordPlaceholder' | translate"
            [class]="
              'w-full rounded-xl border bg-background px-4 py-3 pr-11 text-sm outline-none focus:border-foreground ' +
              (currentPasswordError() ? 'border-loss' : 'border-border')
            "
          />
          <ui-password-toggle
            [visible]="showCurrentPassword()"
            (toggled)="showCurrentPassword.set(!showCurrentPassword())"
          />
        </div>
      </label>
      <label class="block">
        <span class="mb-1.5 block text-xs font-semibold text-muted-foreground"
          >* {{ 'auth.newPassword' | translate }}</span
        >
        <div class="relative">
          <input
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            name="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            [placeholder]="'auth.newPasswordPlaceholder' | translate"
            [class]="
              'w-full rounded-xl border bg-background px-4 py-3 pr-11 text-sm outline-none focus:border-foreground ' +
              (tooShort() ? 'border-loss' : 'border-border')
            "
          />
          <ui-password-toggle [visible]="showNewPassword()" (toggled)="showNewPassword.set(!showNewPassword())" />
        </div>
        @if (tooShort()) {
          <span class="mt-1.5 block text-xs font-semibold text-loss">{{ 'auth.passwordTooShort' | translate }}</span>
        }
      </label>
      <label class="block">
        <span class="mb-1.5 block text-xs font-semibold text-muted-foreground"
          >* {{ 'auth.confirmPassword' | translate }}</span
        >
        <div class="relative">
          <input
            [ngModel]="confirmNewPassword()"
            (ngModelChange)="confirmNewPassword.set($event)"
            name="confirmNewPassword"
            [type]="showConfirmNewPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            [placeholder]="'auth.confirmPasswordPlaceholder' | translate"
            class="w-full rounded-xl border border-border bg-background px-4 py-3 pr-11 text-sm outline-none focus:border-foreground"
          />
          <ui-password-toggle
            [visible]="showConfirmNewPassword()"
            (toggled)="showConfirmNewPassword.set(!showConfirmNewPassword())"
          />
        </div>
        @if (mismatch()) {
          <span class="mt-1.5 block text-xs font-semibold text-loss">{{ 'auth.passwordMismatch' | translate }}</span>
        }
      </label>

      <div class="mt-6 flex flex-wrap justify-end gap-2">
        <button
          type="button"
          (click)="closed.emit()"
          [disabled]="saving()"
          class="cursor-pointer rounded-full border border-border px-4 py-2 text-xs font-extrabold tracking-wide uppercase hover:border-foreground"
        >
          {{ 'common.cancel' | translate }}
        </button>
        <button
          type="submit"
          [disabled]="!canSave()"
          class="cursor-pointer rounded-full bg-lime px-4 py-2 text-xs font-extrabold tracking-wide text-ink uppercase disabled:pointer-events-none disabled:opacity-40"
        >
          {{ (saving() ? 'auth.savingPassword' : 'auth.savePassword') | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
