<div
  [class]="backdropClasses()"
  [class.opacity-0]="closing()"
  role="presentation"
  (click)="onBackdropClick($event)"
>
  <div [class]="panelClasses()" role="dialog" aria-modal="true">
    @if (eyebrow() || showClose()) {
      <div class="flex items-center justify-between gap-2">
        @if (eyebrow()) {
          <p class="text-eyebrow text-muted-foreground">{{ eyebrow() }}</p>
        }
        @if (showClose()) {
          <button
            type="button"
            (click)="requestClose()"
            [attr.aria-label]="'common.close' | translate"
            class="flex cursor-pointer items-center justify-center rounded-full p-1.5 text-muted-foreground hover:bg-muted hover:text-foreground"
          >
            <ui-icon name="close" className="size-4" />
          </button>
        }
      </div>
    }
    <ng-content />
  </div>
</div>
