<button
  type="button"
  (click)="toggled.emit()"
  [attr.aria-label]="(visible() ? 'auth.hidePassword' : 'auth.showPassword') | translate"
  class="absolute inset-y-0 right-0 flex w-11 cursor-pointer items-center justify-center text-muted-foreground hover:text-foreground"
>
  @if (visible()) {
    <span class="text-base leading-none" aria-hidden="true">🎾</span>
  } @else {
    <ui-icon name="eye" className="size-5" />
  }
</button>
