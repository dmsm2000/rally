<ng-template #label>
  <ng-content />
</ng-template>
@if (clickable()) {
  <button
    type="button"
    (click)="toggled.emit()"
    [disabled]="disabled()"
    class="inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition-colors disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-40"
    [class]="classes()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
} @else {
  <span
    class="inline-flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold"
    [class.transition-colors]="!subtle()"
    [class]="classes()"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </span>
}
