<ng-template #label>
  <ng-content />
</ng-template>
@if (clickable()) {
  <button type="button" (click)="toggled.emit()" class="inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition-colors" [class]="classes()">
    <ng-container [ngTemplateOutlet]="label" />
  </button>
} @else {
  <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition-colors" [class]="classes()">
    <ng-container [ngTemplateOutlet]="label" />
  </span>
}
