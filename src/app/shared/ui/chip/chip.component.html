<ng-template #label>
  <ng-content />
</ng-template>
@if (clickable()) {
  <button type="button" (click)="toggled.emit()" class="tube inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-l-none rounded-r-md border py-1.5 pr-3 pl-3.5 text-xs font-semibold transition-colors" [class]="classes()">
    <span class="tube-cap absolute inset-y-0 left-0 w-1.5"></span>
    <ng-container [ngTemplateOutlet]="label" />
  </button>
} @else {
  <span class="tube inline-flex shrink-0 items-center gap-1.5 rounded-l-none rounded-r-md border py-1.5 pr-3 pl-3.5 text-xs font-semibold transition-colors" [class]="classes()">
    <span class="tube-cap absolute inset-y-0 left-0 w-1.5"></span>
    <ng-container [ngTemplateOutlet]="label" />
  </span>
}
