<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4 sm:top-6">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-2xl px-4 py-3.5 text-sm font-bold"
      [class]="kindClasses(t.kind) + ' ' + (leavingIds().has(t.id) ? 'animate-toast-out' : enterClasses(t.kind))"
      role="alert"
    >
      @if (t.kind === 'error') {
        <ui-icon name="error-circle" className="size-5 shrink-0" />
      } @else {
        <span class="shrink-0 text-base leading-none">{{ kindIcon(t.kind) }}</span>
      }
      <span class="flex-1">{{ t.message }}</span>
      <button
        type="button"
        (click)="dismiss(t.id)"
        class="shrink-0 cursor-pointer text-white/80 hover:text-white"
        [attr.aria-label]="'common.dismiss' | translate"
      >
        ✕
      </button>
    </div>
  }
</div>
