<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-label]="'nav.notifications' | translate"
    [attr.aria-expanded]="open()"
    class="relative flex size-9 cursor-pointer items-center justify-center rounded-full border border-border bg-card text-base hover:border-foreground"
  >
    🔔
    @if (notifications.unreadCount() > 0) {
      <span class="absolute -top-1 -right-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-clay px-1 text-[10px] font-extrabold text-bone">{{ notifications.unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="absolute top-full right-0 z-50 mt-1.5 w-80 max-w-[90vw] overflow-hidden rounded-2xl border border-border bg-card shadow-lg">
      <div class="flex items-center justify-between border-b border-border px-4 py-3">
        <p class="text-eyebrow text-muted-foreground">{{ 'notifications.title' | translate }}</p>
        @if (notifications.unreadCount() > 0) {
          <button type="button" (click)="markAllRead()" class="cursor-pointer text-xs font-bold text-muted-foreground hover:text-foreground">{{ 'notifications.markAllRead' | translate }}</button>
        }
      </div>
      <div class="max-h-96 overflow-y-auto">
        @for (n of notifications.all(); track n.id) {
          <button type="button" (click)="select(n)" class="flex w-full items-start gap-3 border-b border-border px-4 py-3 text-left transition-colors last:border-0 hover:bg-muted">
            <span class="text-lg">{{ kindIcon[n.kind] }}</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm" [class.font-bold]="!n.read" [class.text-muted-foreground]="n.read">{{ n.text }}</p>
              @if (n.detail) {
                <p class="mt-0.5 truncate text-xs text-muted-foreground">{{ n.detail }}</p>
              }
              <p class="mt-1 text-[10px] text-muted-foreground">{{ n.time }}</p>
            </div>
            @if (!n.read) {
              <span class="mt-1.5 size-2 shrink-0 rounded-full bg-lime"></span>
            }
          </button>
        } @empty {
          <p class="px-4 py-6 text-center text-sm text-muted-foreground">{{ 'notifications.empty' | translate }}</p>
        }
      </div>
    </div>
  }
</div>
