<article class="overflow-hidden rounded-2xl border border-border bg-card shadow-sm">
  <div class="flex items-center gap-3 p-4">
    <ui-avatar [initials]="player()?.initials ?? ''" [accent]="player()?.accent ?? 'ink'" size="sm" />
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold">{{ item().text }}</p>
      <p class="text-eyebrow mt-0.5 text-muted-foreground">{{ item().time }}</p>
    </div>
  </div>
  @if (item().image) {
    <img [src]="item().image" alt="" loading="lazy" class="aspect-16/8 w-full object-cover" />
  }
  @if (item().detail) {
    <p class="px-4 pt-3 text-sm text-muted-foreground">{{ item().detail }}</p>
  }
  @if (item().stat) {
    <div class="grid grid-cols-3 gap-2 p-4">
      @for (s of item().stat; track s.label) {
        <div class="rounded-xl bg-muted p-3">
          <p class="text-stat text-xl">{{ s.value }}</p>
          <p class="text-eyebrow mt-1 text-muted-foreground">{{ s.label }}</p>
        </div>
      }
    </div>
  } @else {
    <div class="h-4"></div>
  }
</article>
