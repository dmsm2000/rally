<div class="flex flex-col items-center gap-4">
  <img [src]="previewUri()" alt="" class="size-28 rounded-full border border-border bg-muted object-cover sm:size-32" />

  <div class="flex flex-wrap justify-center gap-2">
    @for (s of styles; track s) {
      <button
        type="button"
        (click)="avatarStyle.set(s)"
        [attr.aria-label]="s"
        [attr.aria-pressed]="avatarStyle() === s"
        class="cursor-pointer overflow-hidden rounded-full border-2 transition-colors"
        [class]="avatarStyle() === s ? 'border-lime-deep' : 'border-transparent hover:border-border'"
      >
        <img [src]="thumbUri(s)" alt="" class="size-12 rounded-full bg-muted object-cover" />
      </button>
    }
  </div>

  <button
    type="button"
    (click)="regenerate()"
    class="cursor-pointer rounded-full border border-border px-4 py-2 text-xs font-extrabold tracking-wide uppercase hover:border-foreground"
  >
    🔄 {{ 'avatar.generateAnother' | translate }}
  </button>
</div>
