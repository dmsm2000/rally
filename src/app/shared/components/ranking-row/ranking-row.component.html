<a [routerLink]="['/players', playerId()]" class="flex items-center gap-4 border-b border-border py-3 last:border-0 hover:bg-muted/60">
  <span class="text-stat w-8 text-lg text-muted-foreground">{{ rank() }}</span>
  <ui-avatar [initials]="player()?.initials ?? ''" [accent]="player()?.accent ?? 'ink'" size="sm" />
  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-bold">{{ player()?.name }}</p>
    <p class="text-xs text-muted-foreground">{{ player()?.flag }} {{ player()?.city }} · {{ player()?.level }}</p>
  </div>
  <span class="text-stat text-lg">{{ points().toLocaleString() }}</span>
  <span class="w-8 text-right text-xs font-bold" [class]="trendClass()">{{ trend() }}</span>
</a>
