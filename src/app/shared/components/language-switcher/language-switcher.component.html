<div class="flex items-center gap-1 rounded-full border border-border bg-card p-1" role="group" [attr.aria-label]="'nav.language' | translate">
  @for (locale of i18n.locales; track locale) {
    <button
      type="button"
      (click)="i18n.setLocale(locale)"
      class="rounded-full px-2.5 py-1.5 text-xs font-bold tracking-wide uppercase transition-colors"
      [class.bg-foreground]="i18n.locale() === locale"
      [class.text-background]="i18n.locale() === locale"
      [class.text-muted-foreground]="i18n.locale() !== locale"
    >
      {{ labels[locale] }}
    </button>
  }
</div>
