<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RALLY</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="RALLY é a comunidade de ténis social: encontra jogadores, courts e partidas perto de ti.">
  <!-- Generic, site-wide preview for shared links (WhatsApp, iMessage, etc.) — added 2026-09-11,
       there was none at all before this. This is a static SPA on GitHub Pages with no
       server-side rendering, so every route serves this same tag set; a per-post preview (that
       post's own photo/caption) would need SSR or an edge function serving crawlers a distinct
       response per post id — a real gap, not solved here, see CLAUDE.md's Feed entry. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RALLY">
  <meta property="og:title" content="RALLY">
  <meta property="og:description" content="A comunidade de ténis social: encontra jogadores, courts e partidas perto de ti.">
  <meta property="og:image" content="https://dmsm2000.github.io/rally/assets/hero-rally.jpg">
  <meta property="og:url" content="https://dmsm2000.github.io/rally/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RALLY">
  <meta name="twitter:description" content="A comunidade de ténis social: encontra jogadores, courts e partidas perto de ti.">
  <meta name="twitter:image" content="https://dmsm2000.github.io/rally/assets/hero-rally.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/rally-logo-white.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=JetBrains+Mono:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('rally.theme');
        var dark = stored ? stored === 'dark' : true;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <rally-root></rally-root>
</body>
</html>
