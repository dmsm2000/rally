name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci occasionally dies mid-install with "Exit handler never called!"
      # (a known npm CLI race, npm/cli#4028) — retry instead of failing the deploy.
      - run: npm ci || npm ci || npm ci

      - run: npx ng build --configuration production --base-href /rally/

      # SPA fallback: GitHub Pages has no server-side rewrites, so unknown
      # paths (deep links / refreshes on client-side routes) must also serve index.html.
      - run: cp dist/rally/browser/index.html dist/rally/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rally/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
